name: Check public core

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Run tests (CAD-dependent tests skip when kernels are absent)
        run: uv run --extra dev pytest -q
      - name: Build source and wheel
        run: uv build
