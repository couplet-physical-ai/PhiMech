[project]
name = "phimech"
version = "0.1.0"
description = "Component-driven mechanical CAD: enclosure synthesis with OpenSCAD, FreeCAD and optional MCP tools."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
phimech = "phimech.cli:main"

[project.optional-dependencies]
mcp = ["fastmcp>=3.2.0", "jsonschema>=4.20"]
check = ["numpy-stl>=3.1", "jsonschema>=4.20"]
dev = [
    "build>=1.2",
    "fastmcp>=3.2.0",
    "jsonschema>=4.20",
    "numpy-stl>=3.1",
    "pyflakes>=3.4",
    "pytest>=8",
    "setuptools>=68",
    "wheel>=0.41",
]

# The dependency-free core supports Python 3.9; optional extras need 3.10+.
[tool.uv]
environments = ["python_version >= '3.10'"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["phimech*"]

# The viewer is HTML/CSS/JS plus vendored three.js, none of which setuptools would ship on its
# own: a wheel built without this installs phimech/viewer/server.py with no assets/ beside it,
# so `phimech view` 404s on its own index.html. Works from the repo and from `pip install -e .`
# either way, which is exactly why it would go unnoticed until someone built a real wheel.
[tool.setuptools.package-data]
phimech = [
    "viewer/assets/*.html",
    "viewer/assets/*.css",
    "viewer/assets/*.js",
    "viewer/assets/vendor/*.js",
    "viewer/assets/vendor/*.md",
    "viewer/assets/vendor/LICENSE.threejs",
    "ir/*.json",
    # BOSL2 is data, not code: a wheel without these ships phimech/vendor/bosl2.py with no
    # library beside it, and every `include <BOSL2/...>` is then refused by validate().
    "vendor/BOSL2/*.scad",
    "vendor/BOSL2/LICENSE",
    "vendor/BOSL2/VENDORED.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
